<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>neuralmath — Урок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232C73DA'/><g stroke='%23fff' stroke-width='1.7' stroke-linecap='round'><line x1='9' y1='9' x2='23' y2='16'/><line x1='9' y1='9' x2='9' y2='23'/><line x1='9' y1='23' x2='23' y2='16'/></g><circle cx='9' cy='9' r='3' fill='%23fff'/><circle cx='9' cy='23' r='3' fill='%23fff'/><circle cx='23' cy='16' r='3.2' fill='%23fff'/></svg>">
<style>
:root{
    --bg:#EAF2FC;--surface:#fff;--surface-soft:#F4F8FE;
    --primary:#2C73DA;--primary-dark:#14438F;--primary-light:#D6E6FB;--primary-ghost:#E9F2FD;
    --accent:#13C0E8;--indigo:#5A6BF0;--ink:#0F2747;--ink-soft:#3A567A;--muted:#7891AE;--line:#D3E3F6;
    --success:#22A35A;--success-bg:#E2F6EB;--error:#E25563;--error-bg:#FCEAEC;--warn:#E59B2E;
    --teal:#0B7E92;--purple:#7A4FB5;
    --grad:linear-gradient(135deg,var(--primary),var(--accent));
    --grad-brand:linear-gradient(135deg,var(--indigo),var(--primary) 45%,var(--accent));
    --shadow-sm:0 2px 10px rgba(20,67,143,.07);
    --shadow:0 14px 40px rgba(20,67,143,.13);
    --shadow-lg:0 30px 70px rgba(20,67,143,.20);
    --glow:0 8px 30px rgba(44,115,218,.35);
    --fd:"Unbounded",system-ui,sans-serif;--fb:"Manrope",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--fb);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;
    background:
      radial-gradient(1000px 560px at 88% -12%, #CFE4FB 0, transparent 60%),
      radial-gradient(760px 520px at -8% 108%, #D8EAFE 0, transparent 55%),
      radial-gradient(circle at 1px 1px, rgba(44,115,218,.07) 1px, transparent 0) 0 0/24px 24px,
      var(--bg);
    background-attachment:fixed;}
  sup{font-size:.66em;font-weight:700;line-height:0}
  .expr{font-weight:700;white-space:nowrap}
  button{font-family:inherit;cursor:pointer;border:none;background:none}

  header.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
    padding:13px clamp(16px,4vw,48px);background:rgba(247,251,255,.7);backdrop-filter:blur(18px) saturate(1.1);border-bottom:1px solid rgba(211,227,246,.8)}
  .brand{display:flex;align-items:center;gap:11px;cursor:pointer}
  .brand .logo{width:42px;height:42px;border-radius:13px;background:var(--grad-brand);display:grid;place-items:center;box-shadow:var(--glow);position:relative;overflow:hidden}
  .brand .logo svg{width:24px;height:24px}
  .brand .name{font-family:var(--fd);font-weight:700;font-size:20px;letter-spacing:-.5px}
  .brand .name span{background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent}
  .topbar .right{display:flex;align-items:center;gap:12px}
  .nav-btn{font-weight:700;font-size:14px;color:var(--ink-soft);padding:9px 16px;border-radius:999px;transition:.2s}
  .nav-btn:hover{background:var(--primary-ghost);color:var(--primary-dark)}
  .streak{display:flex;align-items:center;gap:7px;font-weight:800;font-size:14px;background:#fff;color:var(--primary-dark);padding:8px 15px;border-radius:999px;border:1px solid var(--primary-light);box-shadow:var(--shadow-sm)}

  main{max-width:1180px;margin:0 auto;padding:clamp(18px,4vw,44px)}
  .view{display:none;animation:fade .5s ease both}.view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .hero{display:grid;grid-template-columns:1.08fr .92fr;gap:46px;align-items:center;margin-bottom:34px;position:relative}
  .eyebrow{display:inline-flex;gap:8px;align-items:center;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:1.6px;color:var(--primary-dark);background:rgba(255,255,255,.7);padding:8px 15px;border-radius:999px;border:1px solid var(--primary-light);box-shadow:var(--shadow-sm);margin-bottom:22px;backdrop-filter:blur(8px)}
  .eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--grad);box-shadow:0 0 0 4px rgba(44,115,218,.18)}
  .hero h1{font-family:var(--fd);font-weight:800;line-height:1.06;font-size:clamp(34px,5.2vw,58px);letter-spacing:-2px}
  .hero h1 .hl{background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p.lead{font-size:clamp(15px,1.7vw,18px);color:var(--ink-soft);margin:22px 0 30px;max-width:520px}
  .cta{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .btn{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:16px;padding:15px 30px;border-radius:15px;transition:transform .16s,box-shadow .22s,background .2s}
  .btn-primary{background:var(--grad);color:#fff;box-shadow:var(--glow)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(44,115,218,.5)}
  .btn-ghost{background:rgba(255,255,255,.75);color:var(--primary-dark);border:1.5px solid var(--primary-light);box-shadow:var(--shadow-sm);backdrop-filter:blur(8px)}
  .btn-ghost:hover{transform:translateY(-2px);background:#fff}

  .hero-stage{position:relative}
  .blob{position:absolute;inset:-10% -6% -10% -6%;background:conic-gradient(from 120deg,rgba(90,107,240,.20),rgba(19,192,232,.18),rgba(44,115,218,.16),rgba(90,107,240,.20));filter:blur(38px);border-radius:40%;animation:spin 18s linear infinite;z-index:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hero-card{position:relative;z-index:1;background:rgba(255,255,255,.66);backdrop-filter:blur(20px) saturate(1.2);border-radius:28px;padding:32px;box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.7);overflow:hidden}
  .hero-card .tag{display:inline-block;font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:1.4px;color:#fff;background:var(--grad);padding:6px 13px;border-radius:999px}
  .hero-card .mini{font-family:var(--fd);font-weight:800;font-size:46px;text-align:center;margin:14px 0 18px;letter-spacing:-1px;background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hc-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);font-weight:700;border-top:1px solid var(--line);padding-top:15px}
  .hc-row b{color:var(--primary-dark)}
  .float{position:absolute;font-family:var(--fd);font-weight:800;color:var(--primary);user-select:none;pointer-events:none;opacity:.12;animation:bobf 6s ease-in-out infinite}
  .float.a{top:8%;right:10%;font-size:34px;animation-delay:.2s}
  .float.b{bottom:14%;left:6%;font-size:46px;animation-delay:1.4s}
  @keyframes bobf{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

  .sec-head{margin:34px 0 18px}
  .sec-head h2{font-family:var(--fd);font-weight:700;font-size:clamp(20px,3vw,28px);letter-spacing:-.6px}
  .sec-head p{color:var(--muted);margin-top:5px;font-size:14.5px}
  .lesson-card{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;background:rgba(255,255,255,.72);backdrop-filter:blur(14px);border-radius:24px;padding:24px 28px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.7);transition:.2s;cursor:pointer}
  .lesson-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .lesson-num{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;background:var(--grad);color:#fff;font-family:var(--fd);font-weight:800;font-size:30px;box-shadow:var(--glow)}
  .lesson-card h3{font-family:var(--fd);font-weight:600;font-size:21px}
  .lesson-card .meta{color:var(--muted);font-size:14px;margin-top:5px;font-weight:500}
  .lesson-card .meta b{color:var(--primary-dark)}
  .lock{opacity:.55;cursor:not-allowed}.lock:hover{transform:none;box-shadow:var(--shadow)}

  .lesson-grid{display:grid;grid-template-columns:248px 1fr;gap:34px;align-items:start}
  .rail{position:sticky;top:88px}
  .rail-wrap{background:rgba(255,255,255,.6);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.7);border-radius:20px;padding:18px 16px;box-shadow:var(--shadow-sm)}
  .rail h5{font-family:var(--fd);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);margin-bottom:14px}
  .rail-item{display:flex;gap:11px;align-items:center;padding:9px 11px;border-radius:13px;cursor:pointer;transition:.16s;margin-bottom:3px}
  .rail-item:hover{background:var(--primary-ghost)}
  .rail-item.active{background:#fff;box-shadow:var(--shadow-sm);border:1px solid var(--primary-light)}
  .rail-dot{width:26px;height:26px;border-radius:50%;flex:0 0 26px;display:grid;place-items:center;background:var(--primary-light);color:var(--primary-dark);font-weight:800;font-size:12px;transition:.2s}
  .rail-item.active .rail-dot{background:var(--grad);color:#fff;box-shadow:var(--glow)}
  .rail-item.done .rail-dot{background:var(--success);color:#fff}
  .rail-item .rt{font-weight:700;font-size:13px;line-height:1.25}
  .rail-item.active .rt{color:var(--primary-dark)}
  .rail-prog{height:8px;border-radius:99px;background:var(--primary-light);overflow:hidden;margin-top:16px}
  .rail-prog i{display:block;height:100%;background:var(--grad);width:0;transition:width .6s}
  .rail-pct{font-size:12px;color:var(--muted);margin-top:7px;font-weight:700;text-align:center}

  .card{background:rgba(255,255,255,.75);backdrop-filter:blur(16px) saturate(1.1);border-radius:28px;padding:clamp(22px,3.5vw,42px);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.75);min-width:0}
  .tag{display:inline-block;font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--primary-dark);background:var(--primary-ghost);padding:6px 13px;border-radius:999px;margin-bottom:14px}
  .card h2{font-family:var(--fd);font-weight:700;font-size:clamp(21px,3vw,30px);letter-spacing:-.6px;line-height:1.14}
  .theory{font-size:16px;color:var(--ink-soft);margin:14px 0}
  .theory b{color:var(--ink)}
  .callout{background:var(--surface-soft);border-left:4px solid var(--primary);border-radius:14px;padding:15px 19px;margin:16px 0;font-size:15px}
  .callout.warn{border-left-color:var(--warn);background:#FFF7EC}
  .callout .ct{font-weight:800;color:var(--primary-dark);margin-bottom:4px}
  .callout.warn .ct{color:#B9740F}

  .qfrac{display:inline-flex;align-items:center;font-family:var(--fd);font-weight:700;color:var(--primary-dark);font-size:1.15em;letter-spacing:.5px;margin-left:2px}
  .qfrac sup{font-size:.72em;color:var(--primary);font-weight:800}
  .qfrac sub{font-size:.72em;color:var(--muted);font-weight:700}

  .slider-box{background:linear-gradient(135deg,rgba(243,236,251,.8),rgba(255,255,255,.6));border:1.5px solid #E4D7F5;border-radius:18px;padding:22px;margin:18px 0;backdrop-filter:blur(8px)}
  .slider-box .sb-h{font-weight:800;color:var(--purple);margin-bottom:6px;display:flex;gap:8px;align-items:center}
  .slider-box .sb-s{font-size:13.5px;color:var(--ink-soft);margin-bottom:16px}
  .bars{display:flex;gap:24px;align-items:flex-end;height:152px;padding:0 10px}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .bar{width:64px;border-radius:12px 12px 0 0;transition:height .18s cubic-bezier(.3,1,.5,1);min-height:5px}
  .bar.lin{background:linear-gradient(180deg,#86B9FF,var(--primary))}
  .bar.exp{background:linear-gradient(180deg,#3FDCF2,var(--accent))}
  .bar-val{font-family:var(--fd);font-weight:700;font-size:15px;margin-bottom:7px;color:var(--ink)}
  .bar-lbl{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:9px}
  .rng{width:100%;margin-top:18px;accent-color:var(--purple)}
  .rng-lbl{text-align:center;font-weight:800;color:var(--purple);margin-top:6px;font-size:14px}

  .q{margin-top:24px;border-top:1px dashed var(--line);padding-top:22px}
  .q-head{font-weight:800;color:var(--primary-dark);font-size:12.5px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .q-prompt{font-size:16.5px;font-weight:600;margin-bottom:14px}
  .opts{display:grid;gap:9px}
  .opt{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:14px;background:var(--surface-soft);border:1.5px solid var(--line);font-weight:600;font-size:15.5px;transition:.15s;text-align:left;color:var(--ink)}
  .opt:hover:not([disabled]){border-color:var(--primary);background:var(--primary-ghost);transform:translateX(3px)}
  .opt .mk{width:25px;height:25px;border-radius:7px;border:2px solid var(--line);flex:0 0 25px;display:grid;place-items:center;font-weight:800;color:var(--muted);font-size:13px;transition:.15s}
  .opt.sel{border-color:var(--primary);background:var(--primary-ghost)}
  .opt.sel .mk{background:var(--primary);border-color:var(--primary);color:#fff}
  .opt.correct{border-color:var(--success);background:var(--success-bg)}
  .opt.correct .mk{background:var(--success);border-color:var(--success);color:#fff}
  .opt.wrong{border-color:var(--error);background:var(--error-bg)}
  .opt.wrong .mk{background:var(--error);border-color:var(--error);color:#fff}

  .pow-wrap{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
  .pow{display:inline-flex;align-items:flex-start;gap:2px}
  .pin{width:58px;height:50px;border-radius:13px;border:2px solid var(--line);background:#fff;font-family:inherit;font-size:22px;font-weight:700;text-align:center;color:var(--ink);transition:.15s}
  .pin.exp{width:42px;height:38px;font-size:16px;margin-top:-12px}
  .pin.fixed{background:var(--primary-ghost);border-color:var(--primary-light);color:var(--primary-dark)}
  .pin:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(44,115,218,.18)}
  .pin.ok{border-color:var(--success);background:var(--success-bg)}.pin.no{border-color:var(--error);background:var(--error-bg)}
  .num-in{width:84px;height:48px;border-radius:13px;border:2px solid var(--line);background:#fff;font-family:inherit;font-size:18px;font-weight:700;text-align:center;color:var(--ink)}
  .num-in:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(44,115,218,.18)}
  .num-in.ok{border-color:var(--success);background:var(--success-bg)}.num-in.no{border-color:var(--error);background:var(--error-bg)}
  .chain-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .chain-cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  .chain-cell .cl{font-size:13px;font-weight:700;color:var(--muted)}

  .match{display:grid;gap:10px}
  .mrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--surface-soft);border:1.5px solid var(--line);border-radius:14px;padding:11px 15px}
  .mrow .mexp{font-weight:700;font-size:16px}
  .msel{padding:9px 12px;border-radius:11px;border:2px solid var(--line);font-family:inherit;font-weight:700;font-size:15px;background:#fff;color:var(--ink)}
  .msel:focus{outline:none;border-color:var(--primary)}
  .mrow.ok{border-color:var(--success);background:var(--success-bg)}.mrow.no{border-color:var(--error);background:var(--error-bg)}

  .tray{display:flex;flex-wrap:wrap;gap:9px;min-height:50px;padding:11px;background:var(--surface-soft);border:1.5px dashed var(--line);border-radius:14px;margin-bottom:14px}
  .chip{padding:9px 14px;border-radius:12px;background:#fff;border:2px solid var(--primary-light);font-weight:700;font-size:15.5px;color:var(--ink);cursor:grab;transition:.12s;user-select:none}
  .chip:hover{border-color:var(--primary);transform:translateY(-1px)}
  .chip.sel{border-color:var(--primary);background:var(--primary-ghost);box-shadow:0 0 0 3px rgba(44,115,218,.18)}
  .chip.ok{border-color:var(--success);background:var(--success-bg)}.chip.no{border-color:var(--error);background:var(--error-bg)}
  .baskets{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:12px}
  .basket{background:var(--surface-soft);border:2px solid var(--line);border-radius:15px;padding:13px;min-height:98px;transition:.15s}
  .basket.over{border-color:var(--primary);background:var(--primary-ghost)}
  .basket .bh{font-weight:800;font-size:13px;color:var(--primary-dark);text-align:center;margin-bottom:9px;text-transform:uppercase;letter-spacing:.4px}
  .basket .bitems{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}

  .q-act{display:flex;gap:11px;align-items:center;margin-top:15px;flex-wrap:wrap}
  .bsm{padding:11px 19px;border-radius:12px;font-weight:800;font-size:14px;transition:.15s}
  .b-check{background:var(--primary);color:#fff;box-shadow:var(--shadow-sm)}.b-check:hover{background:var(--primary-dark)}
  .b-check[disabled]{background:var(--line);color:var(--muted);cursor:default;box-shadow:none}
  .b-help{background:#fff;color:var(--primary-dark);border:1.5px solid var(--primary-light)}.b-help:hover{background:var(--primary-ghost)}
  .fb{margin-top:13px;padding:14px 17px;border-radius:13px;font-size:14.5px;font-weight:600;display:none;animation:fade .3s ease both}
  .fb.show{display:block}.fb.ok{background:var(--success-bg);color:#177a41;border:1px solid #b6e6c6}.fb.no{background:var(--error-bg);color:#b53341;border:1px solid #f3c3c8}
  .fb .ex{font-weight:500;color:var(--ink-soft);margin-top:5px;display:block}

  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:12px;flex-wrap:wrap}
  .glink{font-weight:700;color:var(--muted);font-size:15px;padding:10px 16px;border-radius:12px;transition:.15s}
  .glink:hover{color:var(--primary-dark);background:var(--primary-ghost)}

  .result{max-width:540px;margin:0 auto;text-align:center;background:rgba(255,255,255,.8);backdrop-filter:blur(16px);border-radius:28px;padding:46px 38px;box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.8)}
  .ring{width:152px;height:152px;margin:0 auto 22px;position:relative}.ring svg{transform:rotate(-90deg)}
  .ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:36px;color:var(--primary-dark)}
  .result h2{font-family:var(--fd);font-weight:700;font-size:26px}.result p{color:var(--ink-soft);margin:12px 0 24px}

  .fab{position:fixed;right:22px;bottom:22px;z-index:50;display:flex;align-items:center;gap:10px;padding:13px 22px 13px 14px;border-radius:999px;background:var(--grad-brand);color:#fff;font-weight:800;font-size:14.5px;box-shadow:var(--glow);transition:transform .18s}
  .fab:hover{transform:translateY(-3px) scale(1.03)}
  .av{display:grid;place-items:center}.av svg{display:block}
  .fab .av{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22)}
  .panel{position:fixed;right:22px;bottom:22px;z-index:60;width:min(404px,calc(100vw - 28px));height:min(626px,calc(100vh - 44px));background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-radius:24px;box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.8);display:none;flex-direction:column;overflow:hidden;animation:pop .26s cubic-bezier(.2,.9,.3,1.2) both}
  .panel.open{display:flex}@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
  .p-top{display:flex;align-items:center;gap:11px;padding:15px 17px;background:var(--grad-brand);color:#fff}
  .p-top .av{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.2)}
  .p-top .ti{flex:1}.p-top .ti b{font-family:var(--fd);font-weight:600;font-size:16px;display:block;letter-spacing:.3px}.p-top .ti span{font-size:12px;opacity:.88}
  .p-top .x{color:#fff;font-size:21px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center}.p-top .x:hover{background:rgba(255,255,255,.18)}
  .p-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface-soft)}
  .msg{max-width:86%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.5;animation:fade .25s ease both}
  .msg.bot{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start;box-shadow:var(--shadow-sm)}

<script>
/* ============ neuralmath — рушій уроку ============ */
// Динамічно обираємо урок за URL-параметром ?l=1 (default) або ?l=2
const lessonId = new URLSearchParams(location.search).get('l') || '1';
const L = window['LESSON' + lessonId];

/* --- Форматування тексту: дроби [n/d], [w n/d] і степені {n} --- */
function M(s){
  s = (s||'');
  // Від'ємне мішане число [-w n/d] — рідко, але трапляється в опціях
  s = s.replace(/\[-(\d+) (\d+)\/(\d+)\]/g, (_,w,n,d) =>
    `−<span class="mixn">${w}<span class="frac"><span>${n}</span><span>${d}</span></span></span>`);
  // Додатне мішане число [w n/d]
  s = s.replace(/\[(\d+) (\d+)\/(\d+)\]/g, (_,w,n,d) =>
    `<span class="mixn">${w}<span class="frac"><span>${n}</span><span>${d}</span></span></span>`);
  // Звичайний дріб з від'ємним чисельником [-n/d]
  s = s.replace(/\[-(\d+)\/(\d+)\]/g, (_,n,d) =>
    `<span class="frac"><span>−${n}</span><span>${d}</span></span>`);
  // Звичайний дріб [n/d] — підтримує літерні символи типу a,b,x,y
  s = s.replace(/\[([^\]\/]+)\/([^\]]+)\]/g, (_,n,d) =>
    `<span class="frac"><span>${n}</span><span>${d}</span></span>`);
  // Степінь {n}
  s = s.replace(/\{([^{}]*)\}/g,'<sup>$1</sup>');
  return s;
}

/* --- Парсинг числових відповідей: ціле / десятковий / дріб n/d / мішане w n/d --- */
function parseVal(s){
  s=(s||'').trim().replace(/,/g,'.').replace(/−/g,'-').replace(/\s+/g,' ');
  if(/^-?\d+$/.test(s)) return parseInt(s,10);
  if(/^-?\d+\.?\d*$/.test(s)) return parseFloat(s);
  const fr=s.match(/^(-?)(\d+)\/(\d+)$/);
  if(fr) return (fr[1]?-1:1)*parseInt(fr[2])/parseInt(fr[3]);
  const mx=s.match(/^(-?)(\d+) (\d+)\/(\d+)$/);
  if(mx) return (mx[1]?-1:1)*(parseInt(mx[2])+parseInt(mx[3])/parseInt(mx[4]));
  return NaN;
}

function norm(s){ return (s||'').toString().toLowerCase().replace(/[−–—]/g,'-').replace(/\s+/g,'').trim(); }

/* ---- Збираємо плоский список завдань (gid) ---- */
let TASKS=[];
L.sections.forEach((s,si)=>s.blocks.forEach((b,bi)=>{
  if(b.t==='q'){ b.gid=b.gid||('t'+TASKS.length); TASKS.push({gid:b.gid,sIdx:si,bIdx:bi,task:b}); }
}));
const TOTAL=TASKS.length;

const state={sec:0,xp:0,answered:{},correct:{},pick:{}};
function goHome(){location.href='index.html';}

/* ---- Збереження прогресу ---- */
const PROG_KEY='nm_progress_l'+lessonId;
function saveProgress(){
  try{ localStorage.setItem(PROG_KEY,JSON.stringify({answered:state.answered,correct:state.correct,xp:state.xp,sec:state.sec})); }catch(e){}
}
function resumeOrStart(){
  go('lesson');
  try{
    const raw=localStorage.getItem(PROG_KEY);
    if(raw){ const s2=JSON.parse(raw); state.answered=s2.answered||{}; state.correct=s2.correct||{}; state.xp=s2.xp||0; state.sec=s2.sec||0; upXP(); renderSection(); return; }
  }catch(e){}
  startLesson();
}

/* ---- Навігація між видами ---- */
function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById('v-'+v).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
function startLesson(){state.sec=0;state.xp=0;state.answered={};state.correct={};state.pick={};upXP();go('lesson');renderSection();saveProgress();}
function upXP(){document.getElementById('xp').textContent=state.xp;}

/* ---- Рейка (карта уроку) ---- */
function secDone(i){return L.sections[i].blocks.filter(b=>b.t==='q').every(b=>state.answered[b.gid]);}
function renderRail(){
  document.getElementById('railList').innerHTML=L.sections.map((s,i)=>
    `<div class="rail-item ${i===state.sec?'active':''} ${secDone(i)?'done':''}" onclick="jump(${i})"><div class="rail-dot">${secDone(i)?'✓':i+1}</div><div class="rt">${s.short}</div></div>`).join('');
  const ans=Object.keys(state.answered).length, pct=Math.round(ans/TOTAL*100);
  document.getElementById('railBar').style.width=pct+'%';
  document.getElementById('railPct').textContent=pct+'% пройдено';
}
function jump(i){state.sec=i;renderSection();saveProgress();}

/* ---- Рендер розділу ---- */
function renderSection(){
  renderRail();
  const s=L.sections[state.sec];
  let html=`<div class="card"><span class="tag">Розділ ${state.sec+1} з ${L.sections.length}</span><h2>${M(s.short)}</h2>`;
  s.blocks.forEach(b=>{
    if(b.t==='th')       html+=`<p class="theory">${M(b.h)}</p>`;
    else if(b.t==='co')  html+=`<div class="callout ${b.warn?'warn':''}"><div class="ct">${M(b.title)}</div>${M(b.x)}</div>`;
    else if(b.t==='slider')  html+=sliderHTML();
    else if(b.t==='slider2') html+=slider2HTML();
    else if(b.t==='q')   html+=questionHTML(b);
  });
  html+=`<div class="foot">${state.sec>0?`<button class="glink" onclick="prevSec()">← Назад</button>`:'<span></span>'}<button class="btn btn-primary" style="padding:13px 26px;font-size:15px" onclick="nextSec()">${state.sec<L.sections.length-1?'Далі →':'Завершити урок ✓'}</button></div></div>`;
  document.getElementById('lessonMain').innerHTML=html;
  s.blocks.forEach(b=>{
    if(b.t==='slider')  initSlider();
    if(b.t==='slider2') initSlider2();
    if(b.t==='q'&&b.kind==='sort') initSort(b);
  });
  setTutorCtx();
}
function nextSec(){ if(state.sec<L.sections.length-1){state.sec++;renderSection();saveProgress();} else {finish();saveProgress();} }
function prevSec(){ if(state.sec>0){state.sec--;renderSection();saveProgress();} }

/* ============ СЛАЙДЕР 1: лінійне vs вибухове зростання ============ */
function sliderHTML(){
  return `<div class="slider-box"><div class="sb-h">🎛 Відчуй різницю</div>
    <div class="sb-s">Потягни повзунок: ліве зростання (5·x) — рівномірне крокування, праве (5<sup>x</sup>) — вибухове зростання степеня.</div>
    <div class="bars"><div class="bar-col"><div class="bar-val" id="vLin">5</div><div class="bar lin" id="bLin"></div><div class="bar-lbl">5·x (лінійно)</div></div>
      <div class="bar-col"><div class="bar-val" id="vExp">5</div><div class="bar exp" id="bExp"></div><div class="bar-lbl">5<sup>x</sup> (степінь)</div></div></div>
    <input type="range" class="rng" id="rng" min="1" max="6" value="1" oninput="updSlider()"><div class="rng-lbl">x = <span id="rngV">1</span></div></div>`;
}
function initSlider(){updSlider();}
function updSlider(){
  const x=+document.getElementById('rng').value;
  const lin=5*x, exp=Math.pow(5,x), maxLin=30, maxExp=Math.pow(5,6);
  document.getElementById('rngV').textContent=x;
  document.getElementById('vLin').textContent=lin;
  document.getElementById('vExp').textContent=exp.toLocaleString('uk');
  document.getElementById('bLin').style.height=(lin/maxLin*100)+'%';
  document.getElementById('bExp').style.height=(exp/maxExp*100)+'%';
}

/* ============ СЛАЙДЕР 2: шоколадний парадокс ============ */
const SL2_FRACS = {
  half: {1:'1/2',2:'1/4',3:'1/8',4:'1/16'},
  big:  {1:'3/2',2:'9/4',3:'27/8',4:'81/16'}
};
let sl2mode='half';

function slider2HTML(){
  return `<div class="slider-box">
    <div class="sb-h">🍫 Шоколадний парадокс</div>
    <div class="sb-s">Обери основу і тягни повзунок. Права смуга — «цілий шматок» (1). Ліва — результат.</div>
    <div style="display:flex;gap:10px;margin:10px 0">
      <button id="sl2b1" class="bsm b-check" onclick="sl2set('half')" style="min-width:90px">Основа ½</button>
      <button id="sl2b2" class="bsm" onclick="sl2set('big')" style="min-width:90px">Основа ³⁄₂</button>
    </div>
    <div style="position:relative;height:52px;border-radius:10px;overflow:hidden;background:var(--bg2,#f1f5f9)">
      <div id="sl2ref" style="position:absolute;right:0;top:0;bottom:0;width:4px;background:#94a3b8"></div>
      <div id="sl2bar" style="height:100%;background:#2C73DA;border-radius:10px;width:50%;transition:width .35s ease;display:flex;align-items:center;justify-content:center">
        <span id="sl2txt" style="color:#fff;font-weight:700;font-size:15px;white-space:nowrap">½</span>
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;font-size:12px;color:#64748b;margin-top:2px">↑ ціле (1)</div>
    <input type="range" class="rng" id="sl2rng" min="1" max="4" value="1" oninput="updSlider2()">
    <div class="rng-lbl">Степінь n = <span id="sl2n">1</span></div>
  </div>`;
}
function initSlider2(){ sl2mode='half'; updSlider2(); }
function sl2set(mode){
  sl2mode=mode;
  document.getElementById('sl2rng').value=1;
  document.getElementById('sl2b1').className='bsm'+(mode==='half'?' b-check':'');
  document.getElementById('sl2b2').className='bsm'+(mode==='big'?' b-check':'');
  updSlider2();
}
function updSlider2(){
  const n=+document.getElementById('sl2rng').value;
  document.getElementById('sl2n').textContent=n;
  const val = sl2mode==='half' ? Math.pow(0.5,n) : Math.pow(1.5,n);
  const pct = Math.min(val*100,250);
  const bar=document.getElementById('sl2bar');
  bar.style.width=pct+'%';
  bar.style.background=sl2mode==='half'?'#2C73DA':'#1D9E75';
  const frac = SL2_FRACS[sl2mode]?.[n]||val.toFixed(3);
  const base = sl2mode==='half'?'½':'³⁄₂';
  document.getElementById('sl2txt').textContent=`(${base})${['¹','²','³','⁴'][n-1]} = ${frac}`;

/* ============ РЕНДЕР ЗАВДАНЬ ============ */
function questionHTML(b){
  const gid=b.gid, done=state.answered[gid];

  return `<div class="q" id="q-${gid}"><div class="q-head">✏️ Завдання <span class="qfrac"><sup>${qn}</sup>&frasl;<sub>${TOTAL}</sub></span></div>

    <div class="q-act"><button class="bsm b-check" id="ck-${gid}" onclick="check('${gid}')" ${done?'disabled':''}>${done?'Перевірено':'Перевірити'}</button>
    <button class="bsm b-help" onclick="askQ('${gid}')">✦ Запитати Vector</button></div>
    <div class="fb" id="fb-${gid}"></div></div>`;
}

  return `<div class="opts">`+b.opts.map((o,i)=>

}

function matchHTML(b){
  return `<div class="match" id="mt-${b.gid}">`+b.left.map((l,i)=>
    `<div class="mrow" data-i="${i}"><span class="mexp">${M(l)}</span><select class="msel" data-i="${i}"><option value="">— обери —</option>${b.right.map(r=>`<option value="${r}">${M(r)}</option>`).join('')}</select></div>`).join('')+`</div>`;

function sortHTML(b){
  return `<div id="sr-${b.gid}"><div class="tray" data-zone="tray">${b.items.map((it,i)=>`<span class="chip" draggable="true" data-i="${i}" data-g="${b.gid}">${M(it)}</span>`).join('')}</div>
    <div class="baskets">${b.cats.map((c,ci)=>`<div class="basket" data-cat="${ci}"><div class="bh">${c}</div><div class="bitems"></div></div>`).join('')}</div></div>`;

function openHTML(b){
  const g=b.gid;
  // Одне числове поле відповіді
  if(b.osub==='num'){
    return `<div style="margin:8px 0;display:flex;align-items:center;gap:8px">
      <input class="num-in" id="${g}-a" inputmode="decimal" placeholder="відповідь" style="width:160px;height:44px;text-align:center;font-size:17px;font-weight:600;border:2px solid #cbd5e1;border-radius:8px"></div>`;
  }
  // Ланцюжок полів (chain, chain2, chain3)
  if(['chain','chain2','chain3','chain4'].includes(b.osub)){
    return `<div class="chain-row">${(b.labels||[]).map((l,k)=>
      `<div class="chain-cell"><span class="cl">${M(l)}</span><input class="num-in" id="${g}-c${k}" inputmode="decimal" placeholder="?"></div>`).join('')}</div>`;
  }
  // Степінь з фіксованою основою: [основа]^□
  if(b.osub==='pow1fixed'){
    return `<div class="pow-wrap"><span class="pow"><input class="pin fixed" value="${b.base}" disabled><input class="pin exp" id="${g}-e" inputmode="numeric" placeholder="n"></span></div>`;
  }
  // Дві пари основа^показник
  if(b.osub==='pow2'){
    return `<div class="pow-wrap">${[0,1].map(k=>`<span class="pow"><input class="pin" id="${g}-b${k}" inputmode="numeric" placeholder="осн"><input class="pin exp" id="${g}-e${k}" inputmode="numeric" placeholder="n"></span>`).join('')}</div>`;
  }
  // Дві пари з фіксованими основами
  if(b.osub==='pow2fixed'){
    return `<div class="pow-wrap">${b.pairs.map((p,k)=>`<span class="pow"><input class="pin fixed" value="${p[0]}" disabled><input class="pin exp" id="${g}-e${k}" inputmode="numeric" placeholder="□"></span>`).join('')}</div>`;
  }
  // Від'ємна основа в дужках
  if(b.osub==='powNeg'){
    return `<div class="pow-wrap"><span class="pow"><input class="pin" id="${g}-b" style="width:78px" placeholder="(−…)"><input class="pin exp" id="${g}-e" inputmode="numeric" placeholder="n"></span></div>`;
  }
  // Три пари (1 у різних формах)
  if(b.osub==='pow3rule'){
    return `<div class="pow-wrap">${[0,1,2].map(k=>`<span class="pow"><input class="pin" id="${g}-b${k}" placeholder="осн"><input class="pin exp" id="${g}-e${k}" inputmode="numeric" placeholder="n"></span>`).join('')}</div>`;
  }
  return '';
}

/* ---- Вибір варіантів ---- */
function pick(g,i,multi){
  if(state.answered[g])return;
  if(!multi){
    state.pick[g]=i;
    document.querySelectorAll(`.opt[data-g="${g}"]`).forEach(b=>b.classList.toggle('sel',+b.dataset.i===i));
  } else {
    state.pick[g]=state.pick[g]||[];
    const a=state.pick[g], k=a.indexOf(i);
    if(k>=0)a.splice(k,1); else a.push(i);
    document.querySelectorAll(`.opt[data-g="${g}"]`).forEach(b=>{
      const s=a.includes(+b.dataset.i); b.classList.toggle('sel',s);
      b.querySelector('.mk').textContent=s?'✓':'';
    });
  }
}

/* ============ СОРТУВАННЯ (drag + tap) ============ */
let sortSel=null;
function initSort(b){
  const root=document.getElementById('sr-'+b.gid);
  root.querySelectorAll('.chip').forEach(ch=>{
    ch.addEventListener('dragstart',e=>{e.dataTransfer.setData('text',ch.dataset.i+'|'+ch.dataset.g);});
    ch.addEventListener('click',()=>{
      if(state.answered[b.gid])return;
      if(sortSel===ch){ch.classList.remove('sel');sortSel=null;}
      else {if(sortSel)sortSel.classList.remove('sel');sortSel=ch;ch.classList.add('sel');}
    });
  });
  root.querySelectorAll('.basket,.tray').forEach(z=>{
    z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over');});
    z.addEventListener('dragleave',()=>z.classList.remove('over'));
    z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('over');const[i,g]=e.dataTransfer.getData('text').split('|');moveChip(g,i,z);});
    z.addEventListener('click',()=>{if(sortSel&&sortSel.dataset.g===b.gid){moveChip(b.gid,sortSel.dataset.i,z);}});
  });
}
function moveChip(g,i,zone){
  if(state.answered[g])return;
  const chip=document.querySelector(`.chip[data-g="${g}"][data-i="${i}"]`);
  const target=zone.classList.contains('basket')?zone.querySelector('.bitems'):zone;
  target.appendChild(chip);chip.classList.remove('sel');sortSel=null;
}

/* ============ ПЕРЕВІРКА ============ */
function evalPow(base,exp){const b=parseFloat(base),e=parseInt(exp,10);if(isNaN(b)||isNaN(e))return NaN;return Math.pow(b,e);}

function check(g){
  const T=TASKS.find(t=>t.gid===g).task;
  if(state.answered[g])return;
  let ok=false, missing=false;

  if(T.kind==='choice'||T.kind==='tf'){
    if(state.pick[g]==null){shake(g);return;}
    ok=state.pick[g]===T.correct;
    document.querySelectorAll(`.opt[data-g="${g}"]`).forEach(b=>{
      b.disabled=true;
      const i=+b.dataset.i;
      if(i===T.correct)b.classList.add('correct');
      else if(i===state.pick[g])b.classList.add('wrong');
    });
  }
  else if(T.kind==='multi'){
    const sel=(state.pick[g]||[]).slice().sort().join(','), ans=T.correct.slice().sort().join(',');
    if(!sel){shake(g);return;}
    ok=sel===ans;
    document.querySelectorAll(`.opt[data-g="${g}"]`).forEach(b=>{
      b.disabled=true;
      const i=+b.dataset.i;
      if(T.correct.includes(i))b.classList.add('correct');
      else if((state.pick[g]||[]).includes(i))b.classList.add('wrong');
    });
  }
  else if(T.kind==='match'){
    const rows=document.querySelectorAll(`#mt-${g} .mrow`);
    ok=true;
    rows.forEach((row,i)=>{
      const sel=row.querySelector('.msel');
      if(!sel.value){missing=true;}
      const good=norm(sel.value)===norm(T.cr[i]);
      if(!good)ok=false;
      sel.disabled=true;
      row.classList.add(good?'ok':'no');
    });
    if(missing){rows.forEach(r=>{r.classList.remove('ok','no');r.querySelector('.msel').disabled=false;});shake(g);return;}
  }
  else if(T.kind==='sort'){
    const root=document.getElementById('sr-'+g);
    const chips=root.querySelectorAll('.chip');
    ok=true; let placed=true;
    chips.forEach(ch=>{
      const basket=ch.closest('.basket');
      if(!basket){placed=false;return;}
      const cat=+basket.dataset.cat;
      const good=cat===T.cc[+ch.dataset.i];
      if(!good)ok=false;
      ch.classList.add(good?'ok':'no');
    });
    if(!placed){chips.forEach(c=>c.classList.remove('ok','no'));shake(g);return;}
    root.querySelectorAll('.chip').forEach(c=>c.setAttribute('draggable','false'));
  }
  else if(T.kind==='open') ok=checkOpen(T,g);

  if(ok===null){shake(g);return;}

  state.answered[g]=true; state.correct[g]=ok;
  const fb=document.getElementById('fb-'+g);
  fb.className='fb show '+(ok?'ok':'no');
  fb.innerHTML=(ok?'✅ Правильно!':'❌ Не зовсім.')+`<span class="ex">${M(T.expl||'')}</span>`;
  const ck=document.getElementById('ck-'+g);
  ck.disabled=true; ck.textContent='Перевірено';
  if(ok){state.xp+=10;upXP();ck.animate([{transform:'scale(1)'},{transform:'scale(1.1)'},{transform:'scale(1)'}],{duration:280});}
  renderRail(); saveProgress();
}

/* --- Перевірка відкритих відповідей --- */
function checkOpen(T,g){
  const val=id=>{const el=document.getElementById(id);return el?(el.value||'').trim():''};
  const mark=(id,good)=>{const el=document.getElementById(id);if(el){el.disabled=true;el.classList.add(good?'ok':'no');}};
  const numEq=(a,b)=>{const av=parseVal(a),bv=parseVal(b);return !isNaN(av)&&!isNaN(bv)&&Math.abs(av-bv)<1e-9;};

  // Одне числове поле
  if(T.osub==='num'){
    const v=val(g+'-a'); if(!v) return null;
    const ok=norm(v)===norm(T.ans)||numEq(v,T.ans);
    mark(g+'-a',ok); return ok;
  }
  // Ланцюжок полів
  if(['chain','chain2','chain3','chain4'].includes(T.osub)){
    const vals=(T.ans||[]).map((_,k)=>val(g+'-c'+k));
    if(vals.some(v=>v==='')) return null;
    let ok=true;
    vals.forEach((v,k)=>{
      const good=norm(v)===norm(T.ans[k])||numEq(v,T.ans[k]);
      if(!good)ok=false; mark(g+'-c'+k,good);
    });
    return ok;
  }
  // Степінь з фіксованою основою
  if(T.osub==='pow1fixed'){
    const e=val(g+'-e'); if(!e) return null;
    const ok=norm(e)===norm(T.expAns); mark(g+'-e',ok); return ok;
  }
  // Дві пари основа^показник
  if(T.osub==='pow2'){
    const got=[[val(g+'-b0'),val(g+'-e0')],[val(g+'-b1'),val(g+'-e1')]];
    if(got.some(p=>!p[0]||!p[1])) return null;
    const key=a=>a.map(p=>norm(p[0])+'^'+norm(p[1])).sort().join('|');
    const ok=key(got)===key(T.accept);
    [0,1].forEach(k=>{mark(g+'-b'+k,ok);mark(g+'-e'+k,ok);}); return ok;
  }
  // Фіксовані основи
  if(T.osub==='pow2fixed'){
    let ok=true, any=false;
    T.pairs.forEach((p,k)=>{
      const e=val(g+'-e'+k); if(!e) return;
      any=true;
      const good=norm(e)===norm(p[1]); if(!good)ok=false; mark(g+'-e'+k,good);
    });
    if(!any) return null; return ok;
  }
  // Від'ємна основа в дужках
  if(T.osub==='powNeg'){
    const b=val(g+'-b'), e=val(g+'-e'); if(!b||!e) return null;
    const ok=T.accept.some(p=>norm(p[0])===norm(b)&&norm(p[1])===norm(e));
    mark(g+'-b',ok); mark(g+'-e',ok); return ok;
  }
  // Три різних основи, кожна ^показник = 1
  if(T.osub==='pow3rule'){
    const ps=[0,1,2].map(k=>[val(g+'-b'+k),val(g+'-e'+k)]);
    if(ps.some(p=>p[0]===''||p[1]==='')) return null;
    const allOne=ps.every(p=>Math.abs(evalPow(p[0],p[1])-1)<1e-9);
    const bases=ps.map(p=>norm(p[0]));
    const distinct=new Set(bases).size===3;
    const ok=allOne&&distinct;
    [0,1,2].forEach(k=>{mark(g+'-b'+k,ok);mark(g+'-e'+k,ok);}); return ok;
  }
  return false;
}

function shake(g){
  const el=document.getElementById('q-'+g);
  el.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:280});
}

/* ---- Фінальний екран ---- */
function finish(){
  const corr=Object.values(state.correct).filter(Boolean).length, pct=Math.round(corr/TOTAL*100);
  go('result');
  document.getElementById('ringFill').style.strokeDashoffset=415-415*pct/100;
  let c=0; const t=setInterval(()=>{c++;document.getElementById('ringNum').textContent=c+'%';if(c>=pct)clearInterval(t);},12);
  document.getElementById('resText').innerHTML=`Ти правильно відповів на <b>${corr}</b> із <b>${TOTAL}</b> завдань і заробив <b>${state.xp} XP</b>.`;
  document.getElementById('resTitle').textContent=pct>=80?'Чудова робота! 🎉':pct>=50?'Гарний прогрес! 💪':'Є над чим попрацювати 🌱';
}

/* ============ ШІ-РЕПЕТИТОР (Vector) ============ */
let hist=[];

function setTutorCtx(){
  const c=document.getElementById('tutorCtx');
  if(c) c.textContent='тема: '+L.sections[state.sec].short;
  renderChips();
}
function renderChips(){
  const tips = lessonId==='2'
    ? {s1:["Чому [1/2]² < [1/2]?","Що таке правильний дріб?"],
       s2:["Як застосувати правило?","Що змінює мінус без дужок?","Яка різниця між (2/3)³ і 2³/3?"],
       s3:["(−[2/3])² і −[2/3]² — однакові?"],
       s4:["Як перетворити мішане число?","Де найчастіше помилка?"],
       s5:["Як перевести 0,75 у дріб?","Що таке НСД?","Пояснення швидкого зсуву"],
       s6:["Підказка до завдання"]}
    : {s1:["Що таке показник?","Чому 2³ і 3² різні?"],s5:["Чим −2³ і (−2)³ різні?"],s6:["Чому a⁰=1?"],s8:["Чому 0⁰ невизначений?"],s10:["Підказка"]};
  const c=tips[L.sections[state.sec].id]||["Поясни простіше","Дай підказку"];
  document.getElementById('pChips').innerHTML=c.map(x=>`<button class="chip2" onclick="quick(this.textContent)">${x}</button>`).join('');
}

function toggleTutor(o){
  document.getElementById('panel').classList.toggle('open',o);
  document.getElementById('fab').style.display=o?'none':'flex';
  if(o&&hist.length===0) addMsg('bot',`Привіт! Я <b>Vector</b> — твій ШІ-репетитор. Питай, що незрозуміло у темі «<b>${L.sections[state.sec].short}</b>» — підкажу так, щоб ти додумав сам.`);
}

function addMsg(r,h){
  const b=document.getElementById('pBody');
  const d=document.createElement('div');
  d.className='msg '+(r==='user'?'user':'bot');
  const safe=(typeof DOMPurify!=='undefined')?DOMPurify.sanitize(h):h;
  d.innerHTML=safe;
  b.appendChild(d); b.scrollTop=b.scrollHeight;
}

function quick(t){document.getElementById('pInput').value=t;sendTutor();}
function askQ(g){
  const T=TASKS.find(t=>t.gid===g).task;
  toggleTutor(true);
  document.getElementById('pInput').value=`Я застряг на завданні: «${T.q.replace(/[\[\]{}<>]/g,'')}». Дай підказку, але не відповідь.`;
  sendTutor();
}

async function sendTutor(){
  const inp=document.getElementById('pInput'), t=inp.value.trim();
  if(!t) return;
  inp.value='';
  addMsg('user',t.replace(/</g,'&lt;'));
  hist.push({role:'user',content:t});
  const send=document.getElementById('pSend');
  send.disabled=true;
  const body=document.getElementById('pBody');
  const typ=document.createElement('div'); typ.className='typing';
  typ.innerHTML='<span></span><span></span><span></span>';
  body.appendChild(typ); body.scrollTop=body.scrollHeight;
  try{
    // Отримуємо Firebase ID-токен — сервер вимагає його для перевірки, хто пише
    const token = (typeof window.getFirebaseToken === 'function')
      ? await window.getFirebaseToken()
      : null;

    const headers = {'Content-Type':'application/json'};
    if (token) headers['Authorization'] = 'Bearer ' + token;

    const res=await fetch('/api/tutor',{
      method:'POST',
      headers,
      body:JSON.stringify({messages:hist.slice(-10),sectionIdx:state.sec,sections:L.sections.map(s=>s.short),lessonTitle:L.title})
    });
    const data=await res.json(); typ.remove();
    if(data.error){addMsg('bot','😣 '+data.error);send.disabled=false;return;}
    const r=data.text||'Спробуй ще раз сформулювати 🙂';
    hist.push({role:'assistant',content:r});
    addMsg('bot',r.replace(/\^(\d+)/g,'<sup>$1</sup>').replace(/\n/g,'<br>'));
  }catch(e){
    typ.remove();
    addMsg('bot','Не вдалося зв\'язатися з сервером 😣');
  }finally{
    send.disabled=false; inp.focus();
  }
}

</script>
